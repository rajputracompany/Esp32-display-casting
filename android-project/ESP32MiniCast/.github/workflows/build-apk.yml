name: Build ESP32 MiniCast Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses & install API 35
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests & build Debug APK
        working-directory: android-project/ESP32MiniCast
        run: gradle testDebugUnitTest assembleDebug --no-daemon

      - name: Upload app-debug.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-MiniCast-Debug-APK
          path: android-project/ESP32MiniCast/app/build/outputs/apk/debug/app-debug.apk
