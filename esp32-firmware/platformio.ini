; ESP32 MiniCast — PlatformIO Configuration
; Target: Original ESP32 DevKit V1 (ESP32-WROOM-32)
; NOT compatible with ESP32-C3, ESP32-S3, or ESP8266 (requires Bluetooth Classic SPP)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
  adafruit/Adafruit SSD1306@^2.5.13
  adafruit/Adafruit GFX Library@^1.11.11
  adafruit/Adafruit BusIO@^1.16.2

build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DMINICAST_FW_VERSION=\"1.2.0\"
